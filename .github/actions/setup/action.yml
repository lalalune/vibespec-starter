name: setup
description: Node 26, pnpm from packageManager, Dafny, Chromium, and the caches of pnpm, Turborepo and spec.
inputs:
  cache:
    description: What tells this job's task cache from another matrix leg's.
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    # Before setup-node: this action puts an old Node on PATH, which setup-node then replaces.
    - uses: dafny-lang/setup-dafny-action@v1
      with:
        dafny-version: "4.11.0"
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # Turborepo skips a task whose inputs it has seen; spec skips a simulation or proof it has seen.
    # Quint downloads its evaluator to ~/.quint from GitHub's rate-limited API: once per cache, not per run.
    - uses: actions/cache@v6
      with:
        path: |
          .turbo
          **/.spec-cache
          ~/.quint
          !**/node_modules/**
        key: tasks-${{ runner.os }}-${{ github.job }}-${{ inputs.cache && format('{0}-', inputs.cache) }}${{ github.sha }}
        restore-keys: |
          tasks-${{ runner.os }}-${{ github.job }}-${{ inputs.cache && format('{0}-', inputs.cache) }}
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Studio's journeys and every test:browser drive a real Chromium; an example's check does not.
    - if: inputs.cache == ''
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
