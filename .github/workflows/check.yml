name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "examples/order", "vibespec/examples/dashboard", "vibespec/examples/assistant", "vibespec/examples/fullstack"]
    steps:
      - uses: actions/checkout@v7
      # The project runtime is installed after Dafny's action selects its own Node.
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node "$GITHUB_WORKSPACE/vibespec/spec.ts" check
        working-directory: ${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-${{ strategy.job-index }}
          path: ${{ matrix.project }}/gen/proof/
          if-no-files-found: ignore

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            vibespec:
              - "vibespec/**"
              - ".claude/skills/**"
              - ".agents/skills/**"
              - "AGENTS.md"
              - "CONTRIBUTING.md"
              - "package*.json"
              - "tsconfig*.json"
      - if: steps.changed.outputs.vibespec == 'true'
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - if: steps.changed.outputs.vibespec == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - if: steps.changed.outputs.vibespec == 'true'
        run: npm ci
      - if: steps.changed.outputs.vibespec == 'true'
        run: npm run selftest
