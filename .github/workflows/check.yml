name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dafny's action installs Node 16 for itself, so Node 24 must come after it.
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Quint's evaluator, which it would otherwise download on every run. `.spec-cache/` is never restored: CI
      # checks from scratch (README, "What is and is not guaranteed").
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('package-lock.json') }}
      - run: npm run check
      - run: npm run check:dashboard

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            tools:
              - "tools/**"
              - "package*.json"
      - if: steps.changed.outputs.tools == 'true'
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - if: steps.changed.outputs.tools == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.changed.outputs.tools == 'true'
        run: npm ci
      - if: steps.changed.outputs.tools == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('package-lock.json') }}
      - if: steps.changed.outputs.tools == 'true'
        run: npm run selftest
