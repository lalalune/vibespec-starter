name: Generate reviewed locks

on:
  push:
    branches: [codex/hierarchy-lock-validation-63d95de]

jobs:
  check:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "examples/order", "examples/dashboard", "examples/assistant", "examples/fullstack"]
    steps:
      - uses: actions/checkout@v4
      # Dafny's action installs Node 16 for itself, so Node 24 must come after it.
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node "$GITHUB_WORKSPACE/tools/spec.ts" accept
        working-directory: ${{ matrix.project }}
      - name: Return the generated review record
        env:
          SPEC_ROOT: ${{ matrix.project }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SPEC_ROOT/spec/lock.json"
          if ! git diff --cached --quiet; then
            git commit -m 'Record fully checked spec reviews'
          fi
          git push origin HEAD:refs/heads/codex/hierarchy-lock-result-63d95de-${{ strategy.job-index }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ strategy.job-index }}
          path: ${{ matrix.project }}/gen/proof/
          if-no-files-found: ignore

