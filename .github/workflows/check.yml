name: check

on:
  push:
    branches: [main]
    paths-ignore:
      - "vibestack/examples/**"
  pull_request:
    paths-ignore:
      - "vibestack/examples/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dafny's action installs Node 16 for itself, so the project Node version must come after it.
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --workspaces=false
      # Quint's evaluator, which it would otherwise download on every run. `.spec-cache/` is never restored: CI
      # checks from scratch.
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('package-lock.json') }}
      - run: npm run check
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof
          path: gen/proof/
          if-no-files-found: ignore

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            tools:
              - "vibestack/**"
              - "package*.json"
      - if: steps.changed.outputs.tools == 'true'
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - if: steps.changed.outputs.tools == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - if: steps.changed.outputs.tools == 'true'
        run: npm ci --workspaces=false
      - if: steps.changed.outputs.tools == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('package-lock.json') }}
      - if: steps.changed.outputs.tools == 'true'
        run: npm run selftest
