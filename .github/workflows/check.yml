name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [".", "vibespec/examples/order", "vibespec/examples/assistant", "vibespec/examples/dashboard", "vibespec/examples/fullstack"]
    steps:
      - uses: actions/checkout@v7
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node "$GITHUB_WORKSPACE/vibespec/spec.ts" check
        working-directory: ${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-${{ strategy.job-index }}
          path: ${{ matrix.project }}/gen/proof/
          if-no-files-found: ignore

  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run selftest
