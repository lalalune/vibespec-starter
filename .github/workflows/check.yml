name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.changed.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            tools:
              - "vibestack/**"
              - "package*.json"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dafny's action installs Node 16 for itself, so the project Node version must come after it.
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --workspaces=false
      # Quint's evaluator, which it would otherwise download on every run. `.spec-cache/` is never restored: CI
      # checks from scratch.
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('package-lock.json') }}
      - run: npm run check
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof
          path: gen/proof/
          if-no-files-found: ignore

  # The selftest builds its scratch projects from vibestack/examples/order, so a change there runs it too.
  selftest:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --workspaces=false
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('package-lock.json') }}
      - run: npm run selftest

  # Studio and the examples, each with its own spec, proofs, tests and lock.
  workspaces:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('package-lock.json') }}
      - run: npm run check --workspaces --if-present
