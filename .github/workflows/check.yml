name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - run: npm ci
      - run: npm run check
      - run: npm run check:dashboard

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            tools:
              - "tools/**"
              - "package*.json"
      - if: steps.changed.outputs.tools == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.changed.outputs.tools == 'true'
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - if: steps.changed.outputs.tools == 'true'
        run: npm ci
      - if: steps.changed.outputs.tools == 'true'
        run: npm run selftest
