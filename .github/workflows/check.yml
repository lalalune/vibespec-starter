name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.changed.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            tools:
              - "vibestack/**"
              - "packages/**"
              - "pnpm-*.yaml"
              - "package*.json"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Quint's evaluator, which it would otherwise download on every run. `.spec-cache/` is never restored: CI
      # checks from scratch.
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm check
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @repo/ui --filter @repo/design-system --filter @repo/storybook test
      - run: pnpm --filter fullstack-todo exec playwright install --with-deps chromium
      - run: pnpm --filter fullstack-todo gen
      - run: pnpm --filter fullstack-todo test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof
          path: gen/proof/
          if-no-files-found: ignore

  # The selftest builds its scratch projects from vibestack/examples/order, so a change there runs it too.
  selftest:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm selftest

  # Studio and the examples, each with its own spec, proofs, tests and lock.
  workspaces:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm -r --if-present check
