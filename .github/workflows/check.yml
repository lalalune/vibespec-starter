name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dafny's action installs Node 16 for itself, so Node 24 must come after it.
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:dashboard

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            vibespec:
              - "vibespec/**"
              - ".claude/skills/**"
              - ".agents/skills/**"
              - "AGENTS.md"
              - "CONTRIBUTING.md"
              - "package*.json"
              - "tsconfig*.json"
      - if: steps.changed.outputs.vibespec == 'true'
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"
      - if: steps.changed.outputs.vibespec == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.changed.outputs.vibespec == 'true'
        run: npm ci
      - if: steps.changed.outputs.vibespec == 'true'
        run: npm run selftest
