name: Validate pushed main cda0304
on:
  push:
    branches: [codex/hierarchy-pushed-validation]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [root, order, assistant, dashboard, fullstack, selftest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cda0304b218a9e2f38e83f3f264f237c439655ca
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: '4.11.0'
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install the locked Quint evaluator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evaluator_version="$(node -p 'require("./node_modules/@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')"
          evaluator_dir="$(node -p 'require("./node_modules/@informalsystems/quint/dist/src/config.js").rustEvaluatorDir(require("./node_modules/@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION)')"
          gh release download "evaluator/$evaluator_version" --repo quint-co/quint --pattern quint_evaluator-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP/quint-evaluator"
          mkdir -p "$evaluator_dir"
          tar -xzf "$RUNNER_TEMP/quint-evaluator/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" -C "$evaluator_dir"
          chmod +x "$evaluator_dir/quint_evaluator"
      - name: Validate ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = selftest ]; then
            npm run selftest 2>&1 | tee validation.log
          elif [ "$TARGET" = root ]; then
            npm run check 2>&1 | tee validation.log
          else
            npm run check --workspace "./vibespec/examples/$TARGET" 2>&1 | tee validation.log
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.target }}
          path: |
            validation.log
            gen/proof/
            vibespec/examples/*/gen/proof/
          if-no-files-found: ignore
