name: fuzz

# Larger property-test budgets and a fresh seed each night; a failure prints
# the seed, and `FUZZ_SEED=<seed> pnpm all check` repeats it. The shrunk
# counterexamples a failing run saves come back as a pull request into develop.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Seed to repeat
        required: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FUZZ_RUNS: "20000"
      FUZZ_SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: ./.github/actions/setup
      # check runs each package's tests; --force, because the same inputs with a new seed are a new run.
      - run: pnpm exec turbo run check --force --continue
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fuzz/${{ github.run_id }}
        run: |
          git add ':(glob)**/test/counterexamples/**'
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "Counterexamples from fuzz run $GITHUB_RUN_ID (FUZZ_SEED=$FUZZ_SEED)"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" --title "Fuzz counterexamples, seed $FUZZ_SEED" \
            --body "The nightly fuzz run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed and saved these shrunk traces. Each is a regression test: decide whether the application or the spec is wrong, fix that, and keep the trace."
