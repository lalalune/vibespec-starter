name: fuzz

# Larger property-test budgets and a fresh seed each night; a failure prints
# the seed, and `FUZZ_SEED=<seed> pnpm test` repeats it.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Seed to repeat
        required: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      FUZZ_RUNS: "20000"
      FUZZ_SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: ./.github/actions/setup
        with:
          dafny: "true"
      - run: pnpm exec turbo run test //#test:tool --force
      - run: pnpm test:models
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: counterexamples
          path: "**/test/counterexamples/"
          if-no-files-found: ignore
