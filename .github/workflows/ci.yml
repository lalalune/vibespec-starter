name: ci

# Every run asks for the same tasks; Turborepo and spec skip what the change
# does not reach, from the cache of the last run. What is headed for main, and
# every push to develop or main, also gets larger property budgets, the
# standalone examples and the tools' own self-test. A pull request into develop
# runs the examples too when it changes what they are built from.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  # A newer commit on a pull request replaces its run; every push to develop or main is checked to the end.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  FULL: ${{ github.event_name == 'push' || github.base_ref == 'main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build typecheck test test:browser check //#lint:js //#lint:css //#analyze --continue
        env:
          FUZZ_RUNS: ${{ env.FULL == 'true' && '1000' || '100' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof
          path: |
            gen/proof/
            vibestack/studio/gen/proof/
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: |
            **/__screenshots__/
            **/test/__traces__/
            !**/node_modules/**
          if-no-files-found: ignore

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [order, assistant, dashboard, fullstack]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request is checked out as its merge into the base, so HEAD^ is the base.
      - id: gate
        run: |
          if [ "$FULL" = true ] || ! git diff --quiet HEAD^ HEAD -- vibestack package.json pnpm-lock.yaml .nvmrc .github; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run
        uses: ./.github/actions/setup
        with:
          cache: ${{ matrix.example }}
      - if: steps.gate.outputs.run
        run: |
          pnpm -C vibestack/examples/${{ matrix.example }} install --frozen-lockfile --ignore-workspace
          pnpm -C vibestack/examples/${{ matrix.example }} check

  selftest:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm selftest
