packages:
  - apps/*
  - packages/*
  - vibestack/studio

# One version of each shared dependency; a package writes "catalog:".
# VibeLang 0.0.12 accepts Effect 4.1.1 only, so Effect and its packages are
# pinned exactly and move together with it.
catalog:
  "@effect/platform-node": 4.1.1
  "@effect/vitest": 4.1.1
  "@eslint-react/eslint-plugin": ^5.30.2
  "@eslint/js": ^10.0.1
  "@tailwindcss/vite": ^4.3.5
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  "@vitest/browser": 5.1.0
  "@vitest/browser-playwright": 5.1.0
  effect: 4.1.1
  eslint: ^10.14.0
  eslint-plugin-boundaries: ^7.4.3
  eslint-plugin-react-hooks: ^7.1.1
  happy-dom: ^21.0.4
  jsdom: ^31.0.1
  knip: ^6.45.1
  madge: ^8.0.0
  playwright: 1.65.0
  react: ^19.3.1
  react-dom: ^19.3.1
  stylelint: ^18.0.0
  stylelint-config-standard: ^41.0.0
  tailwindcss: ^4.3.5
  turbo: ^2.11.11
  typescript: ^6.0.3
  typescript-eslint: ^8.72.2
  vibelang: 0.0.12
  vibelang-runtime: 0.0.12
  vibelang-unplugin: 0.0.12
  vibelang-vite: 0.0.12
  vite: 8.3.5
  vitest: 5.1.0
  # The component system: packages/ui, packages/design-system, packages/storybook.
  "@radix-ui/react-checkbox": ^1.4.1
  "@radix-ui/react-dialog": ^1.3.1
  "@radix-ui/react-label": ^2.1.17
  "@radix-ui/react-progress": ^1.2.1
  "@radix-ui/react-slot": ^1.5.0
  "@storybook/addon-a11y": 10.6.7
  "@storybook/addon-vitest": 10.6.7
  "@storybook/react-vite": 10.6.7
  "@testing-library/user-event": ^14.6.10
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint-plugin-better-tailwindcss: ^4.11.0
  storybook: 10.6.7
  tailwind-merge: ^3.7.0

overrides:
  "@effect/platform-node-shared": 4.1.1

# madge 8 declares TypeScript 5 as an optional peer; it reads TypeScript 6
# projects through --ts-config all the same.
peerDependencyRules:
  allowedVersions:
    "madge>typescript": "6"

allowBuilds:
  esbuild: true
  protobufjs: false
